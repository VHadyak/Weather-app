<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="content-wrapper">
      <div class="search-wrapper">
        <div class="input-container">
          <input type="text" id="search-input" placeholder="Search city" autocomplete="off"/>
          <button type="submit" id="search-btn"></button>
        </div>
        <div class="autocomplete-container">
          <ul></ul>
        </div>
      </div>

      <div class="main-info-wrapper">
        <div id="location-name"></div>
        <div class="degree-wrapper">
          <img src="#" id="condition-icon" />
          <div id="degrees"><span></span></div>
          <div class="degrees-unit">
            <button type="button" class="cel">C</button>
            <button type="button" class="fah">F</button>
          </div>
        </div>
        <div id="condition-desc"></div>
        <div id="feels-like"></div>
        <div id="time-updated">Updated on:</div>
      </div>

      <div class="forecast-switch">
        <button type="button" class="daily-toggle">Daily</button>
        <button type="button" class="hourly-toggle">Hourly</button>
      </div>

      <div class="main-slider-wrapper">
        <button class="prev-btn">&lt</button>
        <div class="slider-wrapper">
          <div class="daily-card-list">
            <div class="daily-card today-card card">
              <p class="day"></p>
              <img src="#" class="daily-icon"></img>
              <div class="high-low">
                <p class="day-high"></p>
                <p class="day-low"></p>
              </div>
              <div class="daily-desc"></div>
            </div>
            <div class="daily-card card">
              <p class="day"></p>
              <img src="#" class="daily-icon"></img>
              <div class="high-low">
                <p class="day-high"></p>
                <p class="day-low"></p>
              </div>
              <div class="daily-desc"></div>
            </div>
            <div class="daily-card card">
              <p class="day"></p>
              <img src="#" class="daily-icon"></img>
              <div class="high-low">
                <p class="day-high"></p>
                <p class="day-low"></p>
              </div>
              <div class="daily-desc"></div>
            </div>
            <div class="daily-card card">
              <p class="day"></p>
              <img src="#" class="daily-icon"></img>
              <div class="high-low">
                <p class="day-high"></p>
                <p class="day-low"></p>
              </div>
              <div class="daily-desc"></div>
            </div>
            <div class="daily-card card">
              <p class="day"></p>
              <img src="#" class="daily-icon"></img>
              <div class="high-low">
                <p class="day-high"></p>
                <p class="day-low"></p>
              </div>
              <div class="daily-desc"></div>
            </div>
            <div class="daily-card card">
              <p class="day"></p>
              <img src="#" class="daily-icon"></img>
              <div class="high-low">
                <p class="day-high"></p>
                <p class="day-low"></p>
              </div>
              <div class="daily-desc"></div>
            </div>
            <div class="daily-card card">
              <p class="day"></p>
              <img src="#" class="daily-icon"></img>
              <div class="high-low">
                <p class="day-high"></p>
                <p class="day-low"></p>
              </div>
              <div class="daily-desc"></div>
            </div>
          </div>
          <div class="hourly-card-list" style="display: none"></div>
        </div>
        <button class="next-btn">></button>
      </div>

      <div class="secondary-info-wrapper">
        <div id="sunrise" class="data-item">
          <div class="flex-left">
            <div class="info-title">Sunrise</div>
            <div class="info-stat" id="sunriseText"></div>
          </div>
          <div class="stat-icon sunrise"></div>
        </div>
        <div id="sunset" class="data-item">
          <div class="flex-left">
            <div class="info-title">Sunset</div>
            <div class="info-stat" id="sunsetText"></div>
          </div>
          <div class="stat-icon sunset"></div>
        </div>
        <div id="wind-speed" class="data-item">
          <div class="flex-left">
            <div class="info-title">Wind speed</div>
            <div class="info-stat" id="wind-speedText"></div>
          </div>
          <div class="stat-icon wind-speed"></div>
        </div>
        <div id="pressure" class="data-item">
          <div class="flex-left">
            <div class="info-title">Pressure</div>
            <div class="info-stat" id="pressureText"></div>
          </div>
          <div class="stat-icon pressure"></div>
        </div>
        <div id="visibility" class="data-item">
          <div class="flex-left">
            <div class="info-title">Visibility</div>
            <div class="info-stat" id="visibilityText"></div>
          </div>
          <div class="stat-icon visibility"></div>
        </div>
        <div id="humidity" class="data-item">
          <div class="flex-left">
            <div class="info-title">Humidity</div>
            <div class="info-stat" id="humidityText"></div>
          </div>
          <div class="stat-icon humidity"></div>
        </div>
        <div id="uv-index" class="data-item">
          <div class="flex-left">
            <div class="info-title">UV index</div>
            <div class="info-stat" id="uv-indexText"></div>
          </div>
          <div class="stat-icon uv-index"></div>
        </div>
        <div id="wind-dir" class="data-item">
          <div class="flex-left">
            <div class="info-title">Wind direction</div>
            <div class="info-stat" id="wind-directionText"></div>
          </div>
          <div class="stat-icon wind-dir"></div>
        </div>
      </div>
    </div>
    <div class="spinner" style="display:none"></div>
  </body>
</html>
